[package]
name = "symbios-ground"
version = "0.4.0"
edition = "2024"
authors = ["Janus"]
description = "An algorithmic terrain engine."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheJanusStream/symbios-ground"
keywords = ["terrain", "procedural", "generative", "simulation"]
categories = ["simulation", "game-development", "mathematics"]

[dependencies]
# Pure-Rust libm (#22): the transcendentals in the derivation path must give
# the same bits on every target. `f32::exp`/`powf` link the platform's libm —
# glibc on x86-64, compiler-builtins on wasm32 — and Rust documents their
# results as platform-dependent, so a native peer and a browser peer derive
# measurably different terrain from the same seed.
libm = "0.2"
rand = "0.9"
rand_pcg = "0.9"
serde = { version = "1.0", features = ["derive", "rc"] }

[dev-dependencies]
serde_json = "1.0"
criterion = "0.8"

[[bench]]
name = "bench_main"
harness = false

[profile.bench]
debug = true
